<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SMC Sample Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1a73e8; --blue-dark: #1765cc; --red: #d93025; --ink: #202124; --ink-light: #5f6368; --border: #dadce0; --bg: #f8f9fa; --card: #ffffff; }
  * { box-sizing: border-box; }
  body { font-family: "Roboto", "Google Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); max-width: 400px; margin: 4rem auto; padding: 0 1.5rem; }
  .brand { font-family: "Google Sans", sans-serif; font-size: 1.6rem; font-weight: 500; margin-bottom: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.08), 0 1px 3px 1px rgba(60,64,67,0.05); }
  label { font-size: 0.8rem; font-weight: 500; color: var(--ink-light); display: block; margin-bottom: 0.4rem; }
  input[type=password] { width: 100%; font-size: 0.95rem; padding: 0.65rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
  input[type=password]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,115,232,0.18); }
  button { width: 100%; background: var(--blue); color: white; border: none; padding: 0.7rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 500; font-family: "Google Sans", sans-serif; }
  button:hover { background: var(--blue-dark); }
  .error { background: #fce8e6; border: 1px solid #f6c6c1; color: var(--red); padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.88rem; }
</style>
</head>
<body>
  <div class="brand">Sample Tracker</div>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autofocus required>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
