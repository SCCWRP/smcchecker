<html>
	<head>
		<link rel="stylesheet" type="text/css" href="{{url_for('static', filename = 'button.css')}}">
		<link rel="stylesheet" type="text/css" href="{{url_for('static', filename = 'trackform.css')}}">
	</head>
	<body>

		<form id="admin-auth-form">
			<label for="adminpw">Please sign in</label>
			<input type="password" name="adminpw">
			<button id="admin-auth-submit-btn" class="btn btn-primary" type="submit">Submit</button>
			<p id="admin-auth-error" style="color: #a52a2a; margin-top: 10px;" hidden></p>
		</form>
	</body>
	<script type="text/javascript">
		const adminAuthError = document.getElementById('admin-auth-error');

		function showAuthError(message) {
			adminAuthError.textContent = message;
			adminAuthError.hidden = false;
		}

		document.getElementById('admin-auth-form')?.addEventListener('submit', (event) => {
			event.preventDefault();
			const formData = new FormData(event.target);
			adminAuthError.hidden = true;
			fetch(
				`{{request.script_root}}/adminauth`, 
				{
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(Object.fromEntries(formData.entries()))
			}
			)
			.then(response => {
				if (!response.ok) {
					throw new Error('Network response was not ok');
				}
				return response.json();
			})
			.then(data => {
				if (data.message === 'true') {
					window.location = `{{request.script_root}}/{{redirect_route}}`
					return;
				}
				// /adminauth answers with the session flag either way, so a wrong
				// password comes back as a normal 200. Without this the form just
				// sat there looking like nothing had happened.
				showAuthError('Incorrect password. Please try again.');
				event.target.reset();
			})
			.catch(error => {
				console.error('There was a problem submitting the form', error);
				showAuthError('Could not reach the server. Please try again.');
			});
		})
	</script>
</html>
